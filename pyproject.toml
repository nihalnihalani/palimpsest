[project]
name = "wiki-hackathon"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cognee[redis]>=1.1,<2",
  "redisvl>=0.18.2",
  "mistralai<2",
  "redis[hiredis]>=5.0",
  "google-generativeai>=0.8",
  "click>=8.1",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "json-repair>=0.25",
  "httpx>=0.27",
]

[project.scripts]
wiki = "wiki_hackathon.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
